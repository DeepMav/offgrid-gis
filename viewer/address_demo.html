<html lang="ko">

<link href="./node_modules/maplibre-gl/dist/maplibre-gl.css" rel="stylesheet" />
<style>

  #clr { position: absolute; right: 8px; top: 8px; cursor: pointer; color: #999; display: none; }
  #res { background: #fff; border: 1px solid #ddd; border-top: 0; border-radius: 0 0 8px 8px; max-height: 340px; overflow: auto; box-shadow: 0 4px 8px rgba(0,0,0,.12); }
  #res div { padding: 8px 11px; cursor: pointer; border-bottom: 1px solid #f1f1f1; }
  #res div.sel, #res div:hover { background: #eef4ff; }
  #hud { position: fixed; bottom: 6px; left: 10px; z-index: 5; color: #036; font: 11px monospace; background: rgba(255,255,255,.85); padding: 4px 8px; border-radius: 5px; }

  #panel h4 { margin: 9px 0 4px; font-size: 11px; color: #667; letter-spacing: .3px; }

  #cats { display: flex; flex-wrap: wrap; gap: 4px; }
  .chip { padding: 3px 8px; border-radius: 12px; border: 1px solid #ccc; background: #fff; cursor: pointer; user-select: none; }
  .chip.on { background: #1a73e8; color: #fff; border-color: #1a73e8; }
  .seg { display: flex; }
  .seg button { flex: 1; padding: 5px; border: 1px solid #ccc; background: #fff; cursor: pointer; font: 11px sans-serif; }
  .seg button.on { background: #333; color: #fff; border-color: #333; }
  .seg button:first-child { border-radius: 6px 0 0 6px; } .seg button:last-child { border-radius: 0 6px 6px 0; border-left: 0; }
  #draw-clear { width: 100%; margin-top: 5px; padding: 5px; border: 1px solid #d33; background: #fff; color: #d33; border-radius: 6px; cursor: pointer; font: 11px sans-serif; }
  #measure { display: none; margin-top: 6px; padding: 5px 7px; background: #fff7e6; border: 1px solid #f0c070; border-radius: 6px; color: #8a5a00; font-size: 11px; }

             border-radius: 6px; color: #14539a; font-size: 11px; }
  #vs-out { position: fixed; left: 10px; bottom: 34px; z-index: 6; width: 300px; font: 12px sans-serif;
            background: rgba(255,255,255,.96); border-radius: 9px; box-shadow: 0 2px 10px rgba(0,0,0,.25);
            padding: 10px 12px 11px; display: none; border-top: 3px solid #12b886; }
  #vs-out .t { font-size: 10px; letter-spacing: .6px; color: #667; font-weight: 700; }

</style>

<body>
<div id="map"></div>
<div id="search"><div id="qbox"><input id="q" placeholder="전국 장소·주소 검색 (예: 강남역, 부산 해운대, 컨벤션)" autocomplete="off"><span id="clr">✕</span></div><div id="res"></div></div>
<div id="panel">
  <h4>베이스맵</h4>
  <div class="seg" id="theme"><button data-t="day" class="on">주간</button><button data-t="night">야간</button></div>
  <h4>레이어</h4>
  <label><input type="checkbox" id="t-bld" checked> 3D 건물</label>
  <label><input type="checkbox" id="t-poi" checked> POI</label>
  <label><input type="checkbox" id="t-label" checked> 지명 라벨</label>
  <label><input type="checkbox" id="t-cluster"> POI 군집(클러스터)</label>
  <label><input type="checkbox" id="t-terrain"> 지형 3D (서울 북부)</label>
  <h4>POI 카테고리</h4>
  <div id="cats"></div>
  <h4>도구 (측정·그리기)</h4>
  <div class="seg" id="tools"><button data-d="line">거리</button><button data-d="poly">면적</button><button data-d="point">주석</button><button data-d="viewshed">가시권</button><button data-d="route">경로</button></div>
  <div id="vs-opts">
    <div class="row"><span>관측 높이 (지표 기준)</span>
      <div class="seg sm" id="vs-h"><button data-h="1.7">1.7 m</button><button data-h="30">30 m</button><button data-h="100" class="on">100 m</button><button data-h="300">300 m</button></div>
    </div>
    <div class="row"><span>분석 반경</span>
      <div class="seg sm" id="vs-r"><button data-r="2000">2 km</button><button data-r="5000" class="on">5 km</button><button data-r="10000">10 km</button></div>
    </div>

  <button id="draw-clear">지우기</button>

</div>
<div id="vs-out">
  <div class="t">가시권 분석</div>
  <div class="big"><span id="vs-area">—</span><small>km² 가시</small></div>

  <div class="m" id="vs-cond"></div>

</div>
<div id="hud">전국 PostGIS 지도 · martin · OSM(ODbL)</div>
<script>
const M = "http://localhost:3001";
const FONT = ["NanumGothic Regular"];
const poiIcon = ["match", ["get","cat"],
  "restaurant","restaurant","cafe","cafe","fast_food","fast-food","bar","bar","pub","bar",
  "hospital","hospital","clinic","hospital","doctors","doctor","dentist","doctor","pharmacy","pharmacy",
  "bank","bank","hotel","lodging","motel","lodging","guest_house","lodging",
  "school","school","university","school","college","school","kindergarten","school",
  "place_of_worship","place-of-worship","supermarket","grocery","convenience","convenience",
  "hairdresser","hairdresser","fuel","fuel","parking","parking","police","police","townhall","town-hall",
  "marker"];
const catColor = ["match", ["get","cat"],
  "restaurant","#f97316","cafe","#f59e0b","fast_food","#fb923c","bar","#ef8a3c","pub","#ef8a3c",
  "hospital","#ef4444","clinic","#ef4444","doctors","#f43f6f","dentist","#f43f6f","pharmacy","#e11d48",
  "bank","#3b82f6",
  "school","#8b5cf6","university","#7c3aed","college","#7c3aed","kindergarten","#a78bfa",
  "supermarket","#10b981","convenience","#14b8a6","shop","#0ea5a5","mall","#0d9488","department_store","#0d9488",
  "hotel","#ec4899","motel","#ec4899","guest_house","#f472b6",
  "place_of_worship","#a16207","fuel","#0891b2","parking","#0e7490","police","#1e40af","townhall","#475569",
  "#9aa3af"];

const style = {
  version: 8,
  glyphs: M + "/font/{fontstack}/{range}.pbf",
  sprite: M + "/sprite/sprite_svg",
  sources: {
    km:  { type: "vector", url: M + "/korea" },
    bld: { type: "vector", url: M + "/gwangju_buildings" },
    poi: { type: "vector", url: M + "/poi" }
  },
  light: { anchor: "viewport", intensity: 0.4, position: [1.3, 90, 35] },
  layers: [
    { id: "bg", type: "background", paint: { "background-color": "#eaf0ea" } },
    { id: "landcover-wood", type: "fill", source: "km", "source-layer": "landcover", filter: ["==",["get","class"],"wood"], paint: { "fill-color": "#a3d68a", "fill-opacity": 0.75 } },
    { id: "landcover-grass", type: "fill", source: "km", "source-layer": "landcover", filter: ["in",["get","class"],["literal",["grass","wetland"]]], paint: { "fill-color": "#c2e3a0", "fill-opacity": 0.7 } },
    { id: "landuse-resid", type: "fill", source: "km", "source-layer": "landuse", filter: ["in",["get","class"],["literal",["residential","suburb","neighbourhood"]]], paint: { "fill-color": "#efe9df" } },
    { id: "landuse-other", type: "fill", source: "km", "source-layer": "landuse", filter: ["in",["get","class"],["literal",["industrial","commercial","retail"]]], paint: { "fill-color": "#ece4e0", "fill-opacity": 0.6 } },
    { id: "park", type: "fill", source: "km", "source-layer": "park", paint: { "fill-color": "#9fd886", "fill-opacity": 0.7 } },
    { id: "water", type: "fill", source: "km", "source-layer": "water", paint: { "fill-color": "#5aa9e6" } },
    { id: "waterway", type: "line", source: "km", "source-layer": "waterway", paint: { "line-color": "#5aa9e6", "line-width": ["interpolate",["linear"],["zoom"],8,0.6,14,3] } },
    // 도로 — 케이싱(테두리) + 본선
    { id: "road-case", type: "line", source: "km", "source-layer": "transportation", filter: ["in",["get","class"],["literal",["motorway","trunk","primary","secondary","tertiary","minor"]]], minzoom: 11,
      layout: { "line-cap":"round","line-join":"round" }, paint: { "line-color": "#d9d2c4", "line-gap-width": ["interpolate",["linear"],["zoom"],11,0.5,16,6], "line-width": 1.4 } },
    { id: "road-minor", type: "line", source: "km", "source-layer": "transportation", filter: ["in",["get","class"],["literal",["minor","service","track"]]], paint: { "line-color": "#ffffff", "line-width": ["interpolate",["linear"],["zoom"],13,0.6,16,3.5] } },
    { id: "road-main", type: "line", source: "km", "source-layer": "transportation", filter: ["in",["get","class"],["literal",["secondary","tertiary","primary","trunk","motorway"]]],
      layout: { "line-cap":"round","line-join":"round" }, paint: { "line-color": ["match",["get","class"],"motorway","#f6a866","trunk","#f8c08a","primary","#fdd9a0","#ffffff"], "line-width": ["interpolate",["linear"],["zoom"],6,0.6,12,2.5,16,7] } },
    { id: "rail", type: "line", source: "km", "source-layer": "transportation", filter: ["==",["get","class"],"rail"], minzoom: 11, paint: { "line-color": "#b6b0a6", "line-width": 1 } },
    // 건물: 전국(PMTiles) + 광주 LiDAR 강조
    { id: "korea-3d", type: "fill-extrusion", source: "km", "source-layer": "building", minzoom: 14, paint: { "fill-extrusion-color": ["interpolate",["linear"],["coalesce",["get","render_height"],6],3,"#e6dcc8",25,"#d4b89a",70,"#bd9678"], "fill-extrusion-height": ["coalesce",["get","render_height"],6], "fill-extrusion-base": ["coalesce",["get","render_min_height"],0], "fill-extrusion-opacity": 0.85 } },
    { id: "bld-3d", type: "fill-extrusion", source: "bld", "source-layer": "gwangju_buildings", minzoom: 13, paint: { "fill-extrusion-color": ["interpolate",["linear"],["get","height"],3,"#cdd6cf",20,"#c4b8a6",45,"#b09a82"], "fill-extrusion-height": ["get","height"], "fill-extrusion-opacity": 0.92 } },
    { id: "bld-label", type: "symbol", source: "bld", "source-layer": "gwangju_buildings", minzoom: 16.5, layout: { "text-field": ["coalesce",["get","addr"],""], "text-font": FONT, "text-size": 10.5, "text-max-width": 7 }, paint: { "text-color": "#333", "text-halo-color": "#fff", "text-halo-width": 1.3 } },
    // POI 카테고리 색상 원 (식당🟠 병원🔴 은행🔵 학교🟣 상점🟢 ...)
    { id: "poi-bg", type: "circle", source: "poi", "source-layer": "poi", minzoom: 13,
      paint: { "circle-radius": ["interpolate",["linear"],["zoom"],13,3.5,17,7], "circle-color": catColor, "circle-stroke-color": "#fff", "circle-stroke-width": 1.3, "circle-opacity": 0.95 } },
    // POI 아이콘 + 이름 (충돌 디클러터)
    { id: "poi-symbol", type: "symbol", source: "poi", "source-layer": "poi", minzoom: 14,
      layout: { "icon-image": poiIcon, "icon-size": ["interpolate",["linear"],["zoom"],13,0.8,17,1.2], "icon-allow-overlap": false,
                "text-field": ["get","name"], "text-font": FONT, "text-size": 11, "text-anchor": "top", "text-offset": [0,1.0], "text-optional": true, "text-max-width": 8 },
      paint: { "text-color": "#3a2a18", "text-halo-color": "#fff", "text-halo-width": 1.5, "icon-halo-color":"#fff","icon-halo-width":1 } },
    // 지명 라벨 (시/구/동)
    { id: "place-city", type: "symbol", source: "km", "source-layer": "place", filter: ["in",["get","class"],["literal",["city","province"]]], minzoom: 5, maxzoom: 13,
      layout: { "text-field": ["get","name"], "text-font": FONT, "text-size": ["interpolate",["linear"],["zoom"],5,12,10,20], "text-max-width": 8 }, paint: { "text-color": "#222", "text-halo-color": "#fff", "text-halo-width": 1.8 } },
    { id: "place-town", type: "symbol", source: "km", "source-layer": "place", filter: ["in",["get","class"],["literal",["town","suburb"]]], minzoom: 10, maxzoom: 16,
      layout: { "text-field": ["get","name"], "text-font": FONT, "text-size": ["interpolate",["linear"],["zoom"],10,11,14,15] }, paint: { "text-color": "#444", "text-halo-color": "#fff", "text-halo-width": 1.5 } },
    { id: "place-village", type: "symbol", source: "km", "source-layer": "place", filter: ["in",["get","class"],["literal",["village","neighbourhood","hamlet"]]], minzoom: 12,
      layout: { "text-field": ["get","name"], "text-font": FONT, "text-size": 11 }, paint: { "text-color": "#666", "text-halo-color": "#fff", "text-halo-width": 1.4 } }
  ]
};
const map = new maplibregl.Map({ container: "map", style, center: [126.8564, 35.1345], zoom: 13.5, pitch: 50, maxPitch: 85, maxZoom: 19 });
window.map = map;   // 스크린샷/디버그용 전역 노출
map.addControl(new maplibregl.NavigationControl({ visualizePitch: true }), "bottom-right");
// 축척은 오른쪽 아래로 — 왼쪽 아래는 가시권 결과 카드가 차지한다
map.addControl(new maplibregl.ScaleControl({ maxWidth: 120, unit: "metric" }), "bottom-right");
map.addControl(new maplibregl.GeolocateControl({ trackUserLocation: false }), "bottom-right");

function popup(lngLat, html) { new maplibregl.Popup().setLngLat(lngLat).setHTML(html).addTo(map); }
map.on("click", "poi-bg", (e) => { if (drawMode) return; const p = e.features[0].properties; popup(e.lngLat, `<b>${p.name||"(이름없음)"}</b><br><span style="color:#888">${p.cat||""}</span>`); });
// 건물 클릭 → 주소 + 높이 (단일 팝업). 광주(bld-3d) 우선, 없으면 전국(korea-3d).
map.on("click", (e) => {
  if (drawMode) return;   // 측정·그리기 중엔 건물 팝업 비활성
  const f = map.queryRenderedFeatures(e.point, { layers: ["poi-bg","bld-3d","korea-3d"] });
  if (!f.length) return;
  if (f.some(x => x.layer.id === "poi-bg")) return;   // POI 클릭은 POI 핸들러가 처리(중복 방지)
  const b = f.find(x => x.layer.id === "bld-3d") || f[0];
  const html = (b.layer.id === "bld-3d")
    ? `<b>${b.properties.addr || "(주소 미상)"}</b><br>높이 ${(+b.properties.height).toFixed(1)}m`
    : `<b>건물</b><br>높이 ${(+b.properties.render_height || 0).toFixed(0)}m`;
  popup(e.lngLat, html);
});
["poi-bg","bld-3d","korea-3d"].forEach(l => { map.on("mouseenter", l, () => map.getCanvas().style.cursor="pointer"); map.on("mouseleave", l, () => map.getCanvas().style.cursor=""); });

// ── 컨트롤 패널: 베이스맵 테마 / 레이어 토글 / POI 카테고리 / 클러스터 / 측정·그리기 ──
let clusterOn = false, drawMode = null;
// 측정 헬퍼 (외부 의존성 없음, 지구 타원체 근사)
function haversine(a,b){ const R=6371000,r=Math.PI/180; const dLa=(b[1]-a[1])*r,dLo=(b[0]-a[0])*r,la1=a[1]*r,la2=b[1]*r; const h=Math.sin(dLa/2)**2+Math.cos(la1)*Math.cos(la2)*Math.sin(dLo/2)**2; return 2*R*Math.asin(Math.sqrt(h)); }
function lineLen(c){ let s=0; for(let i=1;i<c.length;i++) s+=haversine(c[i-1],c[i]); return s; }
function ringArea(c){ if(c.length<3) return 0; const R=6378137,r=Math.PI/180; let a=0; for(let i=0;i<c.length;i++){ const p=c[i],q=c[(i+1)%c.length]; a+=(q[0]-p[0])*r*(2+Math.sin(p[1]*r)+Math.sin(q[1]*r)); } return Math.abs(a*R*R/2); }
function centroid(c){ let x=0,y=0; c.forEach(p=>{x+=p[0];y+=p[1];}); return [x/c.length,y/c.length]; }
function fmtD(m){ return m>=1000?(m/1000).toFixed(2)+" km":Math.round(m)+" m"; }
function fmtA(m){ return m>=1e6?(m/1e6).toFixed(2)+" km²":Math.round(m).toLocaleString()+" m²"; }
const K3D = ["interpolate",["linear"],["coalesce",["get","render_height"],6],3,"#e6dcc8",25,"#d4b89a",70,"#bd9678"];
const B3D = ["interpolate",["linear"],["get","height"],3,"#cdd6cf",20,"#c4b8a6",45,"#b09a82"];
const THEME = {
  day: { bg:{"background-color":"#eaf0ea"}, water:{"fill-color":"#5aa9e6"}, waterway:{"line-color":"#5aa9e6"},
    "landcover-wood":{"fill-color":"#a3d68a"}, "landcover-grass":{"fill-color":"#c2e3a0"},
    "landuse-resid":{"fill-color":"#efe9df"}, "landuse-other":{"fill-color":"#ece4e0"}, park:{"fill-color":"#9fd886"},
    "road-minor":{"line-color":"#ffffff"}, "road-case":{"line-color":"#d9d2c4"},
    "korea-3d":{"fill-extrusion-color":K3D}, "bld-3d":{"fill-extrusion-color":B3D},
    "place-city":{"text-color":"#222","text-halo-color":"#fff"}, "place-town":{"text-color":"#444","text-halo-color":"#fff"},
    "place-village":{"text-color":"#666","text-halo-color":"#fff"}, "poi-symbol":{"text-color":"#3a2a18","text-halo-color":"#fff"} },
  night: { bg:{"background-color":"#0e1116"}, water:{"fill-color":"#16324c"}, waterway:{"line-color":"#16324c"},
    "landcover-wood":{"fill-color":"#15281a"}, "landcover-grass":{"fill-color":"#1b3320"},
    "landuse-resid":{"fill-color":"#171a20"}, "landuse-other":{"fill-color":"#1c1f26"}, park:{"fill-color":"#173120"},
    "road-minor":{"line-color":"#2b313c"}, "road-case":{"line-color":"#222833"},
    "korea-3d":{"fill-extrusion-color":"#2a3040"}, "bld-3d":{"fill-extrusion-color":"#39414f"},
    "place-city":{"text-color":"#dbe2ee","text-halo-color":"#0e1116"}, "place-town":{"text-color":"#aab4c4","text-halo-color":"#0e1116"},
    "place-village":{"text-color":"#8b94a3","text-halo-color":"#0e1116"}, "poi-symbol":{"text-color":"#e7dcc8","text-halo-color":"#11151c"} }
};
const CATS = [["음식",["restaurant","cafe","fast_food","bar","pub"]],["의료",["hospital","clinic","doctors","dentist","pharmacy"]],
  ["교육",["school","university","college","kindergarten"]],["금융",["bank"]],
  ["쇼핑",["supermarket","convenience","shop","mall","department_store"]],["숙박",["hotel","motel","guest_house"]],
  ["공공",["place_of_worship","fuel","parking","police","townhall"]]];

map.on("load", () => {
  const $ = (id) => document.getElementById(id);
  const setVis = (ids, on) => ids.forEach(l => map.getLayer(l) && map.setLayoutProperty(l, "visibility", on ? "visible" : "none"));
  const applyTheme = (t) => { const d = THEME[t]; for (const id in d) for (const p in d[id]) if (map.getLayer(id)) map.setPaintProperty(id, p, d[id][p]); };

  // 테마
  $("theme").querySelectorAll("button").forEach(b => b.onclick = () => {
    $("theme").querySelectorAll("button").forEach(x => x.classList.remove("on")); b.classList.add("on"); applyTheme(b.dataset.t);
  });
  // 레이어 토글
  $("t-bld").onchange = e => setVis(["korea-3d","bld-3d","bld-label"], e.target.checked);
  $("t-label").onchange = e => setVis(["place-city","place-town","place-village"], e.target.checked);
  $("t-poi").onchange = e => { if (!clusterOn) setVis(["poi-bg","poi-symbol"], e.target.checked); };

  // POI 카테고리 필터
  const sel = new Set();
  const applyCats = () => {
    let filt = null;
    if (sel.size) { const list = []; sel.forEach(i => list.push(...CATS[i][1])); filt = ["in", ["get","cat"], ["literal", list]]; }
    ["poi-bg","poi-symbol"].forEach(l => map.getLayer(l) && map.setFilter(l, filt));
  };
  CATS.forEach((c, i) => { const el = document.createElement("span"); el.className = "chip"; el.textContent = c[0];
    el.onclick = () => { el.classList.toggle("on"); el.classList.contains("on") ? sel.add(i) : sel.delete(i); applyCats(); };
    $("cats").appendChild(el); });

  // 클러스터 (뷰포트 POI를 GeoJSON으로 받아 군집)
  const ensureCluster = () => {
    if (map.getSource("poic")) return;
    map.addSource("poic", { type:"geojson", data:{type:"FeatureCollection",features:[]}, cluster:true, clusterMaxZoom:15, clusterRadius:50 });
    map.addLayer({ id:"poic-cl", type:"circle", source:"poic", filter:["has","point_count"],
      paint:{ "circle-color":["step",["get","point_count"],"#51bbd6",50,"#f1a340",200,"#e34a33"],
              "circle-radius":["step",["get","point_count"],15,50,21,200,28], "circle-opacity":0.85, "circle-stroke-color":"#fff","circle-stroke-width":1.5 } });
    map.addLayer({ id:"poic-ct", type:"symbol", source:"poic", filter:["has","point_count"],
      layout:{ "text-field":["get","point_count_abbreviated"], "text-font":FONT, "text-size":12 }, paint:{ "text-color":"#fff" } });
    map.addLayer({ id:"poic-pt", type:"circle", source:"poic", filter:["!",["has","point_count"]],
      paint:{ "circle-color":catColor, "circle-radius":5, "circle-stroke-color":"#fff","circle-stroke-width":1.2 } });
    map.on("click","poic-cl", (e) => { const f = map.queryRenderedFeatures(e.point,{layers:["poic-cl"]})[0];
      map.getSource("poic").getClusterExpansionZoom(f.properties.cluster_id).then(z => map.easeTo({center:f.geometry.coordinates, zoom:z})); });
    map.on("click","poic-pt", (e) => { const p = e.features[0].properties; popup(e.lngLat, `<b>${p.name||""}</b><br><span style="color:#888">${p.cat||""}</span>`); });
    ["poic-cl","poic-pt"].forEach(l => { map.on("mouseenter",l,()=>map.getCanvas().style.cursor="pointer"); map.on("mouseleave",l,()=>map.getCanvas().style.cursor=""); });
  };
  const refreshClusters = async () => {
    if (!clusterOn || !map.getSource("poic")) return;
    if (map.getZoom() < 9) { map.getSource("poic").setData({type:"FeatureCollection",features:[]}); return; }
    const b = map.getBounds();
    try { const gj = await (await fetch(`/poi_bbox?w=${b.getWest()}&s=${b.getSouth()}&e=${b.getEast()}&n=${b.getNorth()}&limit=8000`)).json(); map.getSource("poic").setData(gj); } catch(_){}
  };
  map.on("moveend", refreshClusters);
  $("t-cluster").onchange = (e) => {
    clusterOn = e.target.checked; ensureCluster();
    setVis(["poic-cl","poic-ct","poic-pt"], clusterOn);
    setVis(["poi-bg","poi-symbol"], !clusterOn && $("t-poi").checked);   // 중복 방지
    if (clusterOn) refreshClusters();
  };

  // ── 측정 / 그리기 / 주석 ──
  const measureEl = $("measure");
  let dpts = [];
  const dedupe = (c) => c.filter((p,i)=> i===0 || p[0]!==c[i-1][0] || p[1]!==c[i-1][1]);
  const drawFC = { type:"FeatureCollection", features:[] };
  map.addSource("draw", { type:"geojson", data:drawFC });
  map.addSource("drawing", { type:"geojson", data:{type:"FeatureCollection",features:[]} });
  map.addLayer({ id:"draw-poly", type:"fill", source:"draw", filter:["==",["geometry-type"],"Polygon"], paint:{"fill-color":"#1a73e8","fill-opacity":0.14} });
  map.addLayer({ id:"draw-poly-ln", type:"line", source:"draw", filter:["==",["geometry-type"],"Polygon"], paint:{"line-color":"#1a73e8","line-width":2} });
  map.addLayer({ id:"draw-line", type:"line", source:"draw", filter:["==",["geometry-type"],"LineString"], paint:{"line-color":"#1a73e8","line-width":2.5} });
  map.addLayer({ id:"drawing-fill", type:"fill", source:"drawing", filter:["==",["geometry-type"],"Polygon"], paint:{"fill-color":"#e8731a","fill-opacity":0.1} });
  map.addLayer({ id:"drawing-line", type:"line", source:"drawing", paint:{"line-color":"#e8731a","line-width":2,"line-dasharray":[2,1]} });
  map.addLayer({ id:"draw-pt", type:"circle", source:"draw", filter:["all",["==",["geometry-type"],"Point"],["==",["get","kind"],"anno"]], paint:{"circle-radius":5,"circle-color":"#e8731a","circle-stroke-color":"#fff","circle-stroke-width":2} });
  map.addLayer({ id:"draw-label", type:"symbol", source:"draw", filter:["has","label"], layout:{"text-field":["get","label"],"text-font":FONT,"text-size":12,"text-anchor":"top","text-offset":[0,0.5]}, paint:{"text-color":"#0b3d91","text-halo-color":"#fff","text-halo-width":2} });

  function previewGeom(cursor){
    let c = dedupe(cursor ? dpts.concat([cursor]) : dpts.slice());
    if (drawMode==="line" && c.length>=2) return { f:{type:"Feature",geometry:{type:"LineString",coordinates:c},properties:{}}, txt:"거리 "+fmtD(lineLen(c)) };
    if (drawMode==="poly" && c.length>=3){ const ring=c.concat([c[0]]); return { f:{type:"Feature",geometry:{type:"Polygon",coordinates:[ring]},properties:{}}, txt:"면적 "+fmtA(ringArea(c))+" · 둘레 "+fmtD(lineLen(ring)) }; }
    if (drawMode==="poly" && c.length===2) return { f:{type:"Feature",geometry:{type:"LineString",coordinates:c},properties:{}}, txt:"둘레 "+fmtD(lineLen(c)) };
    return { f:null, txt:"" };
  }
  function refreshPreview(cursor){
    const {f,txt} = previewGeom(cursor);
    map.getSource("drawing").setData(f?{type:"FeatureCollection",features:[f]}:{type:"FeatureCollection",features:[]});
    measureEl.innerHTML = txt ? txt.replace(/([\d.,]+ (?:km²|km|m²|m))/g,"<b>$1</b>") : "";
    measureEl.style.display = txt ? "block" : "none";
  }
  function finishDraw(){
    const c = dedupe(dpts);
    if (drawMode==="line" && c.length>=2){ drawFC.features.push({type:"Feature",geometry:{type:"LineString",coordinates:c},properties:{}}); drawFC.features.push({type:"Feature",geometry:{type:"Point",coordinates:c[Math.floor(c.length/2)]},properties:{kind:"meas",label:fmtD(lineLen(c))}}); }
    else if (drawMode==="poly" && c.length>=3){ const ring=c.concat([c[0]]); drawFC.features.push({type:"Feature",geometry:{type:"Polygon",coordinates:[ring]},properties:{}}); drawFC.features.push({type:"Feature",geometry:{type:"Point",coordinates:centroid(c)},properties:{kind:"meas",label:fmtA(ringArea(c))}}); }
    map.getSource("draw").setData(drawFC); dpts=[]; refreshPreview();
  }
  map.on("click", (e) => {
    if (!drawMode) return;
    if (drawMode==="route"){
      if (!routeStart){ routeStart=[e.lngLat.lng,e.lngLat.lat]; if(routeSM)routeSM.remove(); routeSM=new maplibregl.Marker({color:"#2ecc71"}).setLngLat(routeStart).addTo(map); measureEl.style.display="block"; measureEl.textContent="도착지를 클릭하세요"; }
      else { runRoute(routeStart, [e.lngLat.lng,e.lngLat.lat]); routeStart=null; }
      return;
    }
    if (drawMode==="viewshed"){ runViewshed(e.lngLat.lng, e.lngLat.lat); return; }
    if (drawMode==="point"){ const t=prompt("주석 텍스트:",""); if(t!==null){ drawFC.features.push({type:"Feature",geometry:{type:"Point",coordinates:[e.lngLat.lng,e.lngLat.lat]},properties:{kind:"anno",label:t||"📍"}}); map.getSource("draw").setData(drawFC); } return; }
    dpts.push([e.lngLat.lng,e.lngLat.lat]); refreshPreview();
  });
  map.on("mousemove", (e) => { if (drawMode && drawMode!=="point" && dpts.length) refreshPreview([e.lngLat.lng,e.lngLat.lat]); });
  map.on("dblclick", () => { if (drawMode && drawMode!=="point") finishDraw(); });
  document.addEventListener("keydown", (e) => { if(!drawMode) return; if(e.key==="Enter") finishDraw(); else if(e.key==="Escape"){ dpts=[]; refreshPreview(); } });
  function setMode(m){
    drawMode = (drawMode===m) ? null : m; dpts=[]; routeStart=null; refreshPreview();
    document.querySelectorAll("#tools button").forEach(b=>b.classList.toggle("on", b.dataset.d===drawMode));
    $("vs-opts").style.display = drawMode==="viewshed" ? "block" : "none";
    map.getCanvas().style.cursor = drawMode ? "crosshair" : "";
    drawMode ? map.doubleClickZoom.disable() : map.doubleClickZoom.enable();
  }
  document.querySelectorAll("#tools button").forEach(b=> b.onclick=()=>setMode(b.dataset.d));
  $("draw-clear").onclick=()=>{ drawFC.features=[]; map.getSource("draw").setData(drawFC); dpts=[]; refreshPreview(); map.getSource("vs").setData({type:"FeatureCollection",features:[]}); map.getSource("vsmask").setData({type:"FeatureCollection",features:[]}); map.getSource("vsobs").setData({type:"FeatureCollection",features:[]}); $("vs-out").style.display="none"; clearRoute(); };

  // ── 지형 3D (로컬 terrain-RGB 타일, 서울 북부 시범영역) ──
  $("t-terrain").onchange = (e) => {
    if (e.target.checked) {
      if (!map.getSource("dem")) map.addSource("dem", { type:"raster-dem", tiles:[location.origin+"/terrain/{z}/{x}/{y}.png"], encoding:"terrarium", tileSize:256, minzoom:11, maxzoom:14 });
      if (!map.getLayer("hillshade")) map.addLayer({ id:"hillshade", type:"hillshade", source:"dem", paint:{ "hillshade-exaggeration":0.55, "hillshade-shadow-color":"#3b3b4d" } }, "water");
      map.setLayoutProperty("hillshade","visibility","visible");
      map.setTerrain({ source:"dem", exaggeration:1.5 });
      if (map.getPitch() < 25) map.easeTo({ pitch: 60 });
    } else {
      map.setTerrain(null);
      if (map.getLayer("hillshade")) map.setLayoutProperty("hillshade","visibility","none");
    }
  };

  // ── 가시권 분석 (서버 gdal_viewshed) ──
  // 반경 원을 어둡게 깔고 그 위에 보이는 영역만 밝게 올린다 = 사각지대가 곧바로 읽힌다.
  // (가려진 영역을 폴리곤 차집합으로 만들지 않아도 같은 결과를 눈으로 얻는다)
  let vsH = 100, vsR = 5000;
  map.addSource("vsmask", { type:"geojson", data:{type:"FeatureCollection",features:[]} });
  map.addSource("vs", { type:"geojson", data:{type:"FeatureCollection",features:[]} });
  map.addLayer({ id:"vs-mask", type:"fill", source:"vsmask", paint:{ "fill-color":"#111a24", "fill-opacity":0.52 } });
  map.addLayer({ id:"vs-fill", type:"fill", source:"vs", paint:{ "fill-color":"#25e0b0", "fill-opacity":0.62 } });
  map.addLayer({ id:"vs-line", type:"line", source:"vs", paint:{ "line-color":"#eafff8", "line-width":0.7, "line-opacity":0.55 } });
  map.addLayer({ id:"vs-ring", type:"line", source:"vsmask", paint:{ "line-color":"#ffffff", "line-width":1.6, "line-dasharray":[3,2], "line-opacity":0.9 } });
  // 관측점은 마커 대신 레이어로 — 3D 지형 위에서도 가려지지 않고 라벨을 함께 붙일 수 있다
  map.addSource("vsobs", { type:"geojson", data:{type:"FeatureCollection",features:[]} });
  map.addLayer({ id:"vs-obs", type:"circle", source:"vsobs",
    paint:{ "circle-radius":7, "circle-color":"#ff3b30", "circle-stroke-color":"#fff", "circle-stroke-width":2.5 } });
  map.addLayer({ id:"vs-obs-label", type:"symbol", source:"vsobs",
    layout:{ "text-field":["get","label"], "text-font":FONT, "text-size":12.5, "text-anchor":"bottom", "text-offset":[0,-1.1], "text-allow-overlap":true },
    paint:{ "text-color":"#a30d05", "text-halo-color":"#fff", "text-halo-width":2.2 } });

  // 관측점 중심 반경 원(측지 근사) — 마스크와 가시율 분모로 쓴다
  function circlePoly(lng, lat, radius, steps=180){
    const R=6378137, ring=[];
    for(let i=0;i<=steps;i++){
      const b=2*Math.PI*i/steps, d=radius/R;
      const la=Math.asin(Math.sin(lat*Math.PI/180)*Math.cos(d)+Math.cos(lat*Math.PI/180)*Math.sin(d)*Math.cos(b));
      const lo=lng*Math.PI/180+Math.atan2(Math.sin(b)*Math.sin(d)*Math.cos(lat*Math.PI/180), Math.cos(d)-Math.sin(lat*Math.PI/180)*Math.sin(la));
      ring.push([lo*180/Math.PI, la*180/Math.PI]);
    }
    return { type:"Feature", geometry:{ type:"Polygon", coordinates:[ring] }, properties:{} };
  }
  // 구멍(hole)까지 반영한 전체 면적
  function fcArea(gj){
    let a=0;
    for (const f of (gj.features||[])){
      const g=f.geometry; if(!g) continue;
      const polys = g.type==="Polygon" ? [g.coordinates] : g.type==="MultiPolygon" ? g.coordinates : [];
      for (const rings of polys) rings.forEach((r,i)=> a += (i===0?1:-1)*ringArea(r));
    }
    return a;
  }

  async function runViewshed(lng, lat) {
    const out=$("vs-out"); out.style.display="block";
    $("vs-hint").textContent = "관측점을 다시 클릭하면 그 지점으로 재계산합니다";
    $("vs-area").textContent="…"; $("vs-bar").style.width="0";
    $("vs-ratio").textContent="계산 중"; $("vs-cond").textContent="";
    const circle = circlePoly(lng, lat, vsR);
    map.getSource("vsmask").setData({type:"FeatureCollection",features:[circle]});
    const t0 = performance.now();
    try {
      const gj = await (await fetch(`/viewshed?lon=${lng}&lat=${lat}&h=${vsH}&r=${vsR}`)).json();
      const ms = performance.now()-t0;
      if (gj.error) {
        $("vs-area").textContent="—"; $("vs-ratio").textContent = gj.msg || ("오류: "+gj.error); $("vs-cond").textContent="";
        map.getSource("vs").setData({type:"FeatureCollection",features:[]});
        map.getSource("vsmask").setData({type:"FeatureCollection",features:[]});
        map.getSource("vsobs").setData({type:"FeatureCollection",features:[]}); return;
      }
      map.getSource("vs").setData(gj);
      map.getSource("vsobs").setData({ type:"FeatureCollection", features:[
        { type:"Feature", geometry:{type:"Point",coordinates:[lng,lat]},
          properties:{ label:`관측점 · 지표 +${vsH} m` } }]});
      const vis = fcArea(gj), tot = ringArea(circle.geometry.coordinates[0]);
      const pct = tot ? Math.min(100, vis/tot*100) : 0;
      $("vs-area").textContent = (vis/1e6).toFixed(2);
      $("vs-bar").style.width = pct.toFixed(1)+"%";
      $("vs-ratio").innerHTML = `반경 ${(vsR/1000)} km 원 <b>${(tot/1e6).toFixed(1)}</b> km² 중 <b>${pct.toFixed(1)}%</b> · 사각 <b>${((tot-vis)/1e6).toFixed(1)}</b> km²`;
      $("vs-cond").innerHTML = `관측 <b>+${vsH} m</b> · 대상 <b>1.7 m</b> · ${gj.mode||"DEM"} · 계산 <b>${(ms/1000).toFixed(2)} s</b>`;
      // 가시권은 지형 차폐가 핵심이라 3D 지형을 함께 켠다
      if (!map.getTerrain() && $("t-terrain")) { $("t-terrain").checked = true; $("t-terrain").onchange({target:$("t-terrain")}); }
    } catch(_) { $("vs-area").textContent="—"; $("vs-ratio").textContent="가시권 요청 실패"; }
  }
  document.querySelectorAll("#vs-h button").forEach(b=> b.onclick=()=>{
    vsH=+b.dataset.h; document.querySelectorAll("#vs-h button").forEach(x=>x.classList.toggle("on",x===b)); });
  document.querySelectorAll("#vs-r button").forEach(b=> b.onclick=()=>{
    vsR=+b.dataset.r; document.querySelectorAll("#vs-r button").forEach(x=>x.classList.toggle("on",x===b)); });

  // ── 경로탐색 (pgRouting, 서울권 도로망) ──
  let routeStart=null, routeSM=null, routeEM=null;
  map.addSource("route", { type:"geojson", data:{type:"FeatureCollection",features:[]} });
  map.addLayer({ id:"route-case", type:"line", source:"route", layout:{"line-cap":"round","line-join":"round"}, paint:{ "line-color":"#ffffff", "line-width":7 } });
  map.addLayer({ id:"route-line", type:"line", source:"route", layout:{"line-cap":"round","line-join":"round"}, paint:{ "line-color":"#1a73e8", "line-width":4.5 } });
  async function runRoute(a, b) {
    measureEl.style.display="block"; measureEl.textContent="경로 계산 중…";
    try {
      const gj = await (await fetch(`/route?from=${a[0]},${a[1]}&to=${b[0]},${b[1]}`)).json();
      if (gj.error) { measureEl.textContent = gj.msg || ("오류: "+gj.error); return; }
      map.getSource("route").setData(gj);
      if (routeEM) routeEM.remove();
      routeEM = new maplibregl.Marker({color:"#e74c3c"}).setLngLat(b).addTo(map);
      const p = gj.features[0].properties;
      measureEl.innerHTML = `경로 <b>${(p.dist_m/1000).toFixed(2)} km</b> · 약 <b>${Math.max(1,Math.round(p.time_s/60))}분</b>`;
    } catch(_) { measureEl.textContent = "경로 요청 실패"; }
  }
  function clearRoute(){ routeStart=null; if(routeSM){routeSM.remove();routeSM=null;} if(routeEM){routeEM.remove();routeEM=null;} if(map.getSource("route")) map.getSource("route").setData({type:"FeatureCollection",features:[]}); }
});

// 검색 (키보드 ↑↓ Enter, 지우기)
let marker = null, timer = null, sel = -1, items = [];
const q = document.getElementById("q"), res = document.getElementById("res"), clr = document.getElementById("clr");
function render() { res.innerHTML = items.map((r,i)=>`<div class="${i===sel?'sel':''}"><span style="font-size:10px;color:#fff;background:${r.kind==='도로명주소'?'#2a78b0':'#e07b39'};padding:1px 5px;border-radius:3px">${r.kind}</span> ${r.name}</div>`).join(""); [...res.children].forEach((el,i)=>el.onclick=()=>go(i)); }
function go(i) { const r = items[i]; map.flyTo({center:[r.lon,r.lat],zoom:17,pitch:55}); if(marker)marker.remove(); marker=new maplibregl.Marker({color:"#1a73e8"}).setLngLat([r.lon,r.lat]).setPopup(new maplibregl.Popup().setHTML("<b>"+r.name+"</b>")).addTo(map).togglePopup(); res.innerHTML=""; items=[]; }
q.addEventListener("input", () => { clr.style.display = q.value?"block":"none"; clearTimeout(timer); timer=setTimeout(async()=>{ const v=q.value.trim(); if(!v){items=[];res.innerHTML="";return;} items=await (await fetch("/search?q="+encodeURIComponent(v))).json(); sel=-1; render(); },200); });
q.addEventListener("keydown",(e)=>{ if(!items.length)return; if(e.key==="ArrowDown"){sel=(sel+1)%items.length;render();e.preventDefault();} else if(e.key==="ArrowUp"){sel=(sel-1+items.length)%items.length;render();e.preventDefault();} else if(e.key==="Enter"){go(sel<0?0:sel);} });
clr.onclick=()=>{ q.value="";items=[];res.innerHTML="";clr.style.display="none";q.focus(); };

// URL 파라미터로 카메라/검색 제어 (딥링크 + 스크린샷): ?lon=&lat=&z=&p=(pitch)&b=(bearing)&q=
(function(){
  const u = new URLSearchParams(location.search);
  const num = (k,d)=>{ const v=parseFloat(u.get(k)); return isNaN(v)?d:v; };
  if (["lon","lat","z","p","b"].some(k=>u.has(k))) {
    map.jumpTo({ center:[num("lon",126.9784), num("lat",37.5666)], zoom:num("z",14), pitch:num("p",0), bearing:num("b",0) });
  }
  const sq = u.get("q");
  if (sq) map.once("idle", async ()=>{ q.value=sq; clr.style.display="block";
    try { items = await (await fetch("/search?q="+encodeURIComponent(sq))).json(); sel=0; render(); } catch(_){} });
})();
</script>
</body>
</html>
