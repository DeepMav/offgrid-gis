<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>전주시 항공 LiDAR 점군 (AI Hub 474)</title>
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #0b0e13; }
  #hud { position: fixed; top: 8px; left: 10px; color: #8cf; font: 12px monospace;
         background: rgba(0,0,0,.55); padding: 6px 10px; border-radius: 6px; z-index: 10; }
  #pt { position: fixed; bottom: 10px; left: 10px; color: #ccc; font: 12px monospace;
        background: rgba(0,0,0,.55); padding: 6px 10px; border-radius: 6px; z-index: 10; }
</style>
<script type="importmap">
{ "imports": {
    "three": "./node_modules/three/build/three.module.js",
    "three/addons/": "./node_modules/three/examples/jsm/"
} }
</script>
</head>
<body>
<div id="hud">전주시 항공 LiDAR 로딩 중…</div>
<div id="pt">점 크기: <input id="size" type="range" min="0.2" max="3" step="0.1" value="0.8"> <span id="sv">0.8m</span></div>
<script type="module">
import * as THREE from 'three';
import { PLYLoader } from 'three/addons/loaders/PLYLoader.js';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

const hud = document.getElementById('hud');
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setSize(innerWidth, innerHeight);
renderer.setPixelRatio(Math.min(devicePixelRatio, 1.5));
document.body.appendChild(renderer.domElement);

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x0b0e13);
const camera = new THREE.PerspectiveCamera(60, innerWidth / innerHeight, 0.1, 10000);
camera.position.set(0, 400, 420);

const controls = new OrbitControls(camera, renderer.domElement);
controls.target.set(0, 0, 0);

const ply = (new URLSearchParams(location.search)).get('ply') || 'jeonju.ply';
new PLYLoader().load(ply, (geo) => {
  geo.computeBoundingBox();
  const mat = new THREE.PointsMaterial({ size: 0.8, sizeAttenuation: true, vertexColors: true });
  const pts = new THREE.Points(geo, mat);
  pts.rotateX(-Math.PI / 2);   // LiDAR Z-up → three.js Y-up
  scene.add(pts);
  // 바운딩박스 자동 프레이밍 (타일 1개~여러개 모두 대응)
  const box = new THREE.Box3().setFromObject(pts);
  const size = new THREE.Vector3(); box.getSize(size);
  const center = new THREE.Vector3(); box.getCenter(center);
  const maxDim = Math.max(size.x, size.z);
  controls.target.copy(center);
  camera.position.set(center.x, center.y + maxDim * 0.7, center.z + maxDim * 0.9);
  camera.far = maxDim * 10; camera.updateProjectionMatrix();
  const n = geo.attributes.position.count;
  hud.textContent = `전주시 항공 LiDAR (AI Hub 474) · ${n.toLocaleString()} pts · ${size.x.toFixed(0)}×${size.z.toFixed(0)}m\n드래그=회전 휠=줌 우클릭=이동`;
  document.getElementById('size').addEventListener('input', (e) => {
    mat.size = parseFloat(e.target.value);
    document.getElementById('sv').textContent = e.target.value + 'm';
  });
}, (e) => {
  if (e.lengthComputable) hud.textContent = `로딩 ${(e.loaded / e.total * 100).toFixed(0)}%`;
}, (err) => { hud.textContent = '로드 실패: ' + err; });

addEventListener('resize', () => {
  camera.aspect = innerWidth / innerHeight; camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});
(function loop() { requestAnimationFrame(loop); controls.update(); renderer.render(scene, camera); })();
</script>
</body>
</html>
