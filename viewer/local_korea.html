<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>로컬 남한 지도 (자체빌드 PMTiles)</title>
<link href="./node_modules/maplibre-gl/dist/maplibre-gl.css" rel="stylesheet" />
<style>
  html, body, #map { margin: 0; height: 100%; width: 100%; }
  #hud { position: fixed; top: 8px; left: 10px; z-index: 5; color: #036; font: 12px/1.5 monospace;
         background: rgba(255,255,255,.9); padding: 6px 10px; border-radius: 6px; }
  #attr { position: fixed; bottom: 0; right: 0; z-index: 5; font: 10px sans-serif; color: #333;
          background: rgba(255,255,255,.7); padding: 2px 6px; }
</style>
<script src="./node_modules/maplibre-gl/dist/maplibre-gl.js"></script>
<script src="./node_modules/pmtiles/dist/pmtiles.js"></script>
</head>
<body>
<div id="map"></div>
<div id="hud">로컬 남한 지도 (planetiler 자체빌드 · 오프라인)<br>로딩 중…</div>
<div id="attr">© OpenMapTiles © OpenStreetMap contributors</div>
<script>
const hud = document.getElementById("hud");
window.addEventListener("error", (e) => hud.innerHTML = "❌ " + e.message);
const protocol = new pmtiles.Protocol({ metadata: true });
maplibregl.addProtocol("pmtiles", protocol.tile);
const PM = "pmtiles://" + location.origin + "/korea.pmtiles";

const roadW = ["interpolate", ["linear"], ["zoom"], 6, 0.4, 12, 2, 16, 8];
const style = {
  version: 8, sources: { km: { type: "vector", url: PM, attribution: "© OpenMapTiles © OpenStreetMap contributors" } },
  light: { anchor: "viewport", intensity: 0.45, position: [1.2, 90, 40] },
  layers: [
    { id: "bg", type: "background", paint: { "background-color": "#f6f4ef" } },
    { id: "landcover", type: "fill", source: "km", "source-layer": "landcover",
      paint: { "fill-color": ["match", ["get", "class"], "wood", "#cfe0c2", "grass", "#dcebcf", "#e3e9da"], "fill-opacity": 0.6 } },
    { id: "landuse", type: "fill", source: "km", "source-layer": "landuse",
      paint: { "fill-color": ["match", ["get", "class"], "residential", "#ece9e3", "industrial", "#e6e2dd", "#eceae3"], "fill-opacity": 0.5 } },
    { id: "park", type: "fill", source: "km", "source-layer": "park", paint: { "fill-color": "#d6eccb", "fill-opacity": 0.6 } },
    { id: "water", type: "fill", source: "km", "source-layer": "water", paint: { "fill-color": "#a3c9ef" } },
    { id: "waterway", type: "line", source: "km", "source-layer": "waterway", paint: { "line-color": "#a3c9ef", "line-width": ["interpolate", ["linear"], ["zoom"], 8, 0.5, 14, 2.5] } },
    { id: "road-minor", type: "line", source: "km", "source-layer": "transportation",
      filter: ["in", ["get", "class"], ["literal", ["minor", "service", "track", "path"]]],
      paint: { "line-color": "#ffffff", "line-width": ["interpolate", ["linear"], ["zoom"], 13, 0.5, 16, 3] } },
    { id: "road-main", type: "line", source: "km", "source-layer": "transportation",
      filter: ["in", ["get", "class"], ["literal", ["secondary", "tertiary", "primary", "trunk", "motorway"]]],
      paint: { "line-color": ["match", ["get", "class"], "motorway", "#f7b27a", "trunk", "#f9c79a", "#ffffff"], "line-width": roadW } },
    { id: "rail", type: "line", source: "km", "source-layer": "transportation", filter: ["==", ["get", "class"], "rail"],
      paint: { "line-color": "#bbb", "line-width": 1 } },
    { id: "building", type: "fill-extrusion", source: "km", "source-layer": "building", minzoom: 13,
      paint: { "fill-extrusion-color": "#d6cdbf",
               "fill-extrusion-height": ["coalesce", ["get", "render_height"], 6],
               "fill-extrusion-base": ["coalesce", ["get", "render_min_height"], 0],
               "fill-extrusion-opacity": 0.95 } },
    { id: "boundary", type: "line", source: "km", "source-layer": "boundary", filter: ["<=", ["get", "admin_level"], 4],
      paint: { "line-color": "#c0a0c0", "line-width": 1, "line-dasharray": [3, 2] } }
  ]
};

const map = new maplibregl.Map({ container: "map", style, center: [127.5, 36.3], zoom: 6.6, pitch: 0, maxPitch: 80, maxZoom: 18 });
map.addControl(new maplibregl.NavigationControl({ visualizePitch: true }));
map.on("error", (e) => { if (e && e.error) hud.innerHTML = "map.error: " + e.error.message; });
map.on("load", () => { hud.innerHTML = "로컬 남한 지도 (planetiler 자체빌드 · 오프라인 PMTiles 623MB)<br>줌인하면 도로·건물(3D). 도시로 더블클릭/줌"; });
</script>
</body>
</html>
